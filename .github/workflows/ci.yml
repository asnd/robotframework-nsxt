name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install (locked, editable + dev)
        run: uv sync --locked --extra dev

      - name: Ruff (lint Python)
        run: uv run ruff check .

      - name: Mypy (type-check library)
        run: uv run mypy src/

      - name: Pytest (unit tests)
        run: uv run pytest -q

      - name: Robocop (lint Robot suites)
        run: uv run robocop check src/ tests/

      - name: Robot dry-run (all suites resolve)
        run: uv run robot --dryrun -V env.example.yaml -d results tests/

      - name: Build wheel + sdist
        run: uv build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

      - name: Upload dry-run results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: results/
