name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install (locked, dev group)
        run: uv sync --locked --python ${{ matrix.python-version }} --group dev

      - name: Ruff (lint Python)
        run: uv run ruff check .

      - name: Mypy (type-check library + mock)
        run: uv run mypy src/ mock_nsx/

      - name: Pytest (unit tests, with coverage)
        run: uv run pytest -q --cov=nsxt_robot --cov=mock_nsx --cov-report=xml --cov-report=term

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage.xml

      - name: Robocop (lint Robot suites)
        run: uv run robocop check src/ tests/

      - name: Robot dry-run (all suites resolve)
        run: uv run robot --dryrun -V env.example.yaml -d results tests/

      - name: Build wheel + sdist
        if: matrix.python-version == '3.12'
        run: uv build

      - name: Upload dist artifacts
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/*

      - name: Upload dry-run results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: robot-results-${{ matrix.python-version }}
          path: results/

  robot-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install (locked, mock group only — no dev tools needed)
        run: uv sync --locked --no-default-groups --group mock

      - name: Start mock NSX Manager
        run: |
          uv run python -m mock_nsx --port 8443 > mock_nsx.log 2>&1 &
          echo $! > mock_nsx.pid
          for i in $(seq 1 30); do
            if curl -sk -o /dev/null https://127.0.0.1:8443/mock/health; then
              echo "mock_nsx is up"
              exit 0
            fi
            sleep 1
          done
          echo "mock_nsx did not become healthy in time" >&2
          cat mock_nsx.log >&2
          exit 1
        env:
          NO_PROXY: localhost,127.0.0.1

      - name: Run control-plane suites against the mock
        run: |
          uv run robot -d results -V env.mock.yaml \
            -e dataplane -e destructive -e ha -e evpn \
            tests/01_infra tests/02_t1_connectivity tests/03_static_routing \
            tests/04_bgp_bfd tests/05_ha_vip tests/06_snat tests/07_alb_l4 \
            tests/08_dfw tests/09_alb_l7 tests/10_t0_vrf tests/11_failover
        env:
          NO_PROXY: localhost,127.0.0.1

      - name: Stop mock NSX Manager
        if: always()
        run: kill "$(cat mock_nsx.pid)" 2>/dev/null || true

      - name: Upload robot-mock results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: robot-mock-results
          path: results/

      - name: Upload mock server log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mock-nsx-log
          path: mock_nsx.log

  docs:
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install (locked, dev group)
        run: uv sync --locked --group dev

      - name: Generate keyword docs
        run: scripts/gen_docs.sh

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/

  deploy-docs:
    runs-on: ubuntu-latest
    needs: docs
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
