# Variables for running the control-plane suites against mock_nsx (see
# mock_nsx/fixtures.py) instead of a live NSX-T lab:
#
#   uv run --group mock python -m mock_nsx --port 8443 &
#   uv run robot -V env.mock.yaml -e dataplane -e destructive -e ha -e evpn tests/
#
# T0_GATEWAY_ID / EDGE_CLUSTER_ID / OVERLAY_TZ_ID / VLAN_TZ_ID must match the
# constants seeded in mock_nsx/fixtures.py — the mock pre-creates this topology
# rather than starting from an empty manager.
NSX_MANAGER:        "127.0.0.1"
NSX_PORT:           8443
NSX_USER:           "admin"
NSX_PASSWORD:       "VMware1!VMware1!"
VERIFY_SSL:         false

T0_GATEWAY_ID:      "t0-gw"
EDGE_CLUSTER_ID:    "edge-cluster-1"
OVERLAY_TZ_ID:      "overlay-tz"

# BGP
BGP_LOCAL_ASN:      65001
BGP_PEER_IP:        "192.0.2.1"
BGP_PEER_ASN:       65000
BFD_INTERVAL:       500
BFD_MULTIPLIER:     3

# HA VIP
HA_VIP_IP:          "192.0.2.100/24"

# Test VMs — not real hosts against the mock; `dataplane`-tagged tests that
# would SSH/probe these are excluded when running against mock_nsx.
VM1_IP:             "172.16.1.10"
VM2_IP:             "172.16.2.10"
VM_USER:            "root"
VM_PASSWORD:        "unused-against-mock"
EXTERNAL_TEST_IP:   "192.0.2.5"

BBPROBE_REMOTE_PATH:  "/usr/local/bin/bbprobe"
PROBE_MAX_LATENCY:    2.0

# SNAT
SNAT_TRANSLATED_IP: "192.0.2.50"

# DNAT (inbound: external floating IP → internal server)
DNAT_DESTINATION_IP: "192.0.2.51"
DNAT_TRANSLATED_IP:  "172.16.1.10"

# DFW (distributed firewall micro-segmentation)
DFW_TEST_TAG:       "app|bbtest"

# ALB
ALB_VIP:            "192.0.2.60"
ALB_POOL_MEMBERS:
  - "172.16.1.10"
ALB_VIP_PORT:       80
ALB_POOL_PORT:      8080

# ALB L7 (HTTP) + health monitor
ALB_L7_VIP:         "192.0.2.61"
ALB_L7_VIP_PORT:    80
ALB_MONITOR_PORT:   8080
ALB_MONITOR_URL:    "/"

# Overlay MTU probe (1472B payload + 28B headers = 1500B inner frame)
OVERLAY_MTU_PAYLOAD: 1472

# Segments
T1A_SEGMENT_CIDR:   "172.16.1.1/24"
T1B_SEGMENT_CIDR:   "172.16.2.1/24"

# T0-VRF / EVPN (tests/10_t0_vrf)
VLAN_TZ_ID:           "vlan-tz"
VRF_PARENT_LS_ID:     "default"
VRF_UPLINK_VLAN:      100
VRF_UPLINK_IP:        "192.168.100.2"
VRF_UPLINK_PREFIX:    24
VRF_STATIC_NETWORK:   "10.99.0.0/24"
VRF_STATIC_NEXTHOP:   "192.168.100.1"
VRF_BGP_PEER_IP:      "192.168.100.1"
VRF_BGP_PEER_ASN:     65000
VRF_RD:               "65001:100"
VRF_RT_IMPORT:        "65001:100"
VRF_RT_EXPORT:        "65001:100"
VRF_EVPN_TRANSIT_VNI: 75001
EVPN_VNI_POOL_START:  75001
EVPN_VNI_POOL_END:    75100

# Failure simulation (tests/11_failover) — EDGE_PASSWORD stays empty so the
# `destructive` (real SSH restart/reboot) tests skip themselves; they're
# excluded outright in a mock run anyway since there's no real edge to SSH to.
FAILOVER_MAX_RECOVERY:     "5 sec"
EDGE_REBOOT_MAX_RECOVERY:  "5 sec"
EDGE1_MGMT_IP:              "192.0.2.20"
EDGE_USER:                  "admin"
EDGE_PASSWORD:               ""
EDGE_SSH_PORT:               22
